# Le site de la boutique : des fichiers, servis tels quels. Les appels à l'API ne passent pas
# par ici : Traefik envoie /api directement au backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                 # nginx ne dit pas sa version

    # Le navigateur n'exécute que ce qui vient de la boutique elle-même.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
}
